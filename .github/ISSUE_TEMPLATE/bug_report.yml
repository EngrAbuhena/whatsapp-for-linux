name: Bug report
description: Something isn't working
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill this in so we can reproduce it.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.2"
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: Ubuntu / distro & version
      placeholder: "Ubuntu 24.04, GNOME"
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [.deb, AppImage, Snap, Flatpak, From source]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      placeholder: Steps to reproduce, expected vs actual...
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Terminal output (if any)
      render: shell
